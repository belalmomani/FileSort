name: Import ZIP

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: 'ZIP file name in the repository root'
        required: true
        default: 'FileSort-Phase1.zip'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        env:
          ZIP: ${{ inputs.zip_name }}
        run: |
          test -f "$ZIP" || { echo "ZIP not found: $ZIP"; exit 1; }
          mkdir _import
          unzip -q -o "$ZIP" -d _import
          rm -- "$ZIP"
          cp -a _import/. .
          rm -rf _import
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Import $ZIP" || echo "Nothing to commit"
          git push
